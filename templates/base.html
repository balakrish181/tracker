{% set app_title = 'Mole Analysis' %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_title }}</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <style>
    /* ===== Semantic Color System ===== */
    :root {
      --color-analysis: #2563eb;
      --color-screening: #4f46e5;
      --color-compare: #d97706;
      --color-longitudinal: #059669;

      --color-risk-low: #16a34a;
      --color-risk-medium: #d97706;
      --color-risk-high: #dc2626;
    }

    /* ===== Accessibility ===== */
    .focus-ring:focus {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    .skip-link {
      position:absolute; left:-10000px;
      width:1px; height:1px; overflow:hidden;
    }

    .skip-link:focus {
      position:static; width:auto; height:auto;
      padding:0.5rem 1rem;
      background:#111827;
      color:#fff;
      border-radius:0.25rem;
    }

    /* ===== Shared Components ===== */
    .app-card {
      background: #ffffff;
      border-radius: 0.75rem;
      border: 1px solid #f3f4f6;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: #1f2937;
    }

    .page-subtitle {
      color: #6b7280;
      margin-top: 0.5rem;
    }

    .metric-card {
      background: white;
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid #f3f4f6;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .metric-label {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .metric-bar-bg {
      height: 6px;
      background: #e5e7eb;
      border-radius: 9999px;
      margin-top: 6px;
    }

    .metric-bar-fill {
      height: 6px;
      border-radius: 9999px;
    }

    .risk-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }

    .risk-low { background:#dcfce7; color:var(--color-risk-low); }
    .risk-medium { background:#fef3c7; color:var(--color-risk-medium); }
    .risk-high { background:#fee2e2; color:var(--color-risk-high); }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 1000;
    }

    .toast-item {
      background: #111827;
      color:#fff;
      padding: .75rem 1rem;
      border-radius: .5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,.1);
      margin-top: .5rem;
    }

    /* ===== Loading Overlay ===== */
    .loading-mask {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index: 900;
      align-items:center;
      justify-content:center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--color-analysis);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0%{transform:rotate(0)}
      100%{transform:rotate(360deg)}
    }

    /* ===== Active Nav ===== */
    .nav-link {
      color:#374151;
      transition: color .2s;
    }

    .nav-link:hover {
      color: var(--color-analysis);
    }

    .nav-active {
      color: var(--color-analysis);
      font-weight: 600;
      border-bottom: 2px solid var(--color-analysis);
      padding-bottom: 2px;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">

  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <!-- Left: Branding -->
      <div class="flex items-center space-x-4">
        <div class="h-9 w-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">
          M
        </div>
        <div>
          <div class="text-lg font-semibold">{{ app_title }}</div>
          <div class="text-xs text-gray-500">
            Local Research Mode
          </div>
        </div>
      </div>

      <!-- Center: Navigation -->
      <nav class="hidden md:flex items-center space-x-8 text-sm" aria-label="Primary">
        <a href="{{ url_for('home') }}"
           class="nav-link {% if request.endpoint=='home' %}nav-active{% endif %}">
           Dashboard
        </a>

        <a href="{{ url_for('single_view') }}"
           class="nav-link {% if request.endpoint=='single_view' %}nav-active{% endif %}">
           Single
        </a>

        <a href="{{ url_for('full_body_view') }}"
           class="nav-link {% if request.endpoint=='full_body_view' %}nav-active{% endif %}">
           Full Body
        </a>

        <a href="{{ url_for('compare_view') }}"
           class="nav-link {% if request.endpoint=='compare_view' %}nav-active{% endif %}">
           Compare
        </a>

        <a href="{{ url_for('compare_full_body_view') }}"
           class="nav-link {% if request.endpoint=='compare_full_body_view' %}nav-active{% endif %}">
           FB Compare
        </a>
      </nav>

      <!-- Right: System Info -->
      <div class="hidden lg:block text-xs text-gray-500 text-right">
        <div>YOLOv8-1280 | Seg v1.2 | LoFTR</div>
        <div class="text-gray-400">Build 2026.02</div>
      </div>

    </div>
  </header>

  <!-- Main -->
  <main id="main" class="max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Loading Overlay -->
  <div id="loading-mask" class="loading-mask">
    <div class="bg-white rounded-xl p-8 shadow-lg text-center">
      <div class="spinner mx-auto"></div>
      <p class="mt-4 font-medium text-gray-700">
        Running Analysis...
      </p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <script>
    window.UI = {
      toast(msg, type='info') {
        const wrap = document.getElementById('toast');
        const el = document.createElement('div');
        el.className = 'toast-item';

        if (type === 'error') el.style.background = '#b91c1c';
        if (type === 'success') el.style.background = '#065f46';

        el.textContent = msg;
        wrap.appendChild(el);
        setTimeout(() => { el.remove(); }, 4000);
      },

      loading(show) {
        document.getElementById('loading-mask').style.display = show ? 'flex' : 'none';
      }
    }
  </script>

  {% block scripts %}{% endblock %}

</body>
</html>
