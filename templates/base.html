{% set app_title = 'Mole Analysis' %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    .focus-ring:focus { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .skip-link { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
    .skip-link:focus { position:static; width:auto; height:auto; padding:0.5rem 1rem; background:#111827; color:#fff; border-radius:0.25rem; }
    .toast { position: fixed; right: 1rem; bottom: 1rem; z-index: 1000; }
    .toast-item { background: #111827; color:#fff; padding: .75rem 1rem; border-radius: .5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); margin-top: .5rem; }
    .loading-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index: 900; align-items:center; justify-content:center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 44px; height: 44px; animation: spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">M</div>
        <h1 class="text-xl font-semibold">{{ app_title }}</h1>
      </div>
      <nav class="hidden md:flex items-center space-x-6" aria-label="Primary">
        <a href="{{ url_for('home') }}" class="text-gray-700 hover:text-blue-600">Dashboard</a>
        <a href="{{ url_for('single_view') }}" class="text-gray-700 hover:text-blue-600">Single</a>
        <a href="{{ url_for('full_body_view') }}" class="text-gray-700 hover:text-blue-600">Full Body</a>
        <a href="{{ url_for('compare_view') }}" class="text-gray-700 hover:text-blue-600">Compare</a>
        <a href="{{ url_for('compare_full_body_view') }}" class="text-gray-700 hover:text-blue-600">FB Compare</a>
      </nav>
    </div>
  </header>

  <main id="main" class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <div id="loading-mask" class="loading-mask">
    <div class="bg-white rounded-lg p-6 shadow">
      <div class="spinner mx-auto"></div>
      <p class="mt-3 font-medium text-gray-700">Processing...</p>
    </div>
  </div>
  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <script>
    window.UI = {
      toast(msg, type='info') {
        const wrap = document.getElementById('toast');
        const el = document.createElement('div');
        el.className = 'toast-item';
        el.textContent = msg;
        if (type === 'error') { el.style.background = '#b91c1c'; }
        if (type === 'success') { el.style.background = '#065f46'; }
        wrap.appendChild(el);
        setTimeout(() => { el.remove(); }, 4000);
      },
      loading(show) {
        document.getElementById('loading-mask').style.display = show ? 'flex' : 'none';
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
